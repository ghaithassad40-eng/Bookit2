<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Bookit.png" />
    <link rel="apple-touch-icon" href="/Bookit.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5" />
    <meta name="theme-color" content="#FAFAF7" />
    <title>Bookit — Book services & places across the GCC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!--
      Boot splash. Renders immediately on HTML parse — before the React bundle
      downloads / parses / mounts — so the user sees the brand animation the
      instant the page opens. Hidden by main.tsx once React renders (with a
      5s safety timer so a JS failure can never leave it stuck on screen).
      Inlined intentionally; do not extract to an external stylesheet.
    -->
    <style>
      .boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #fafaf7;
        background-image: radial-gradient(
          circle at 50% 38%,
          rgba(201, 162, 39, 0.10) 0%,
          rgba(201, 162, 39, 0.04) 35%,
          #fafaf7 70%
        );
        transition: opacity 0.45s ease;
      }
      .boot-loader.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      .boot-loader__video {
        width: min(320px, 64vw);
        height: auto;
        max-height: 60vh;
        object-fit: contain;
        /* Subtle navy shadow under the logo on the light backdrop */
        filter: drop-shadow(0 12px 32px rgba(27, 42, 78, 0.18));
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-loader__video { animation: none; }
      }
    </style>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="boot-loader" class="boot-loader" aria-hidden="true">
      <video
        class="boot-loader__video"
        src="/bookit-loader.mp4"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
      ></video>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
